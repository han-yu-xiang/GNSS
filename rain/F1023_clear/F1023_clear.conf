; GNSS-SDR configuration for GPS L1 C/A
; RF-Catcher interleaved int16 I/Q
; Fs = 10.23 MHz
; Project root: E:\rain

[GNSS-SDR]
GNSS-SDR.internal_fs_sps=10230000
GNSS-SDR.observable_interval_ms=20
GNSS-SDR.tow_to_trk=true
GNSS-SDR.pre_2009_file=false

SignalSource.implementation=File_Signal_Source
SignalSource.filename=/mnt/e/rain/F1023_clear/F1023_clear.bin
SignalSource.item_type=ishort
SignalSource.sampling_frequency=10230000
SignalSource.samples=0
SignalSource.repeat=false

SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ishort_To_Complex
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex

Channels_1C.count=12
Channels.in_acquisition=12
Channel.signal=1C

Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_step=250
Acquisition_1C.blocking=true

Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.extend_correlation_symbols=1
Tracking_1C.pll_bw_hz=40.0
Tracking_1C.dll_bw_hz=4.0
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.carrier_aiding=true
Tracking_1C.enable_fll_pull_in=true
Tracking_1C.enable_fll_steady_state=false
Tracking_1C.fll_bw_hz=15.0
Tracking_1C.pull_in_time_s=5

Tracking_1C.dump=true
Tracking_1C.dump_filename=/mnt/e/rain/F1023_clear/results/tracking/F1023_clear_track_ch_
Tracking_1C.dump_mat=true

TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=true
TelemetryDecoder_1C.dump_filename=/mnt/e/rain/F1023_clear/results/telemetry/F1023_clear_telemetry_ch_
TelemetryDecoder_1C.dump_mat=true
TelemetryDecoder_1C.remove_dat=false
TelemetryDecoder_1C.dump_crc_stats=true
TelemetryDecoder_1C.dump_crc_stats_filename=/mnt/e/rain/F1023_clear/results/telemetry/F1023_clear_crc_stats

Observables.implementation=Hybrid_Observables
Observables.enable_carrier_smoothing=false
Observables.dump=true
Observables.dump_filename=/mnt/e/rain/F1023_clear/results/observables/F1023_clear_observables.dat
Observables.dump_mat=true

PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=1000
PVT.display_rate_ms=1000
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false

; Explicit output policy for darkroom/rain re-processing
; Keep generic output disabled and selectively enable only required products.
PVT.output_enabled=false
PVT.rtcm_output_file_enabled=false

; Navigation / observables products
PVT.rinex_output_enabled=true
PVT.rinex_version=3
PVT.rinex_name=RINEXFILE
PVT.rinexobs_rate_ms=1000
PVT.rinex_output_path=/mnt/e/rain/F1023_clear/results/rinex

; NMEA trajectory + satellite-in-view information
PVT.nmea_output_file_enabled=true
PVT.nmea_rate_ms=1000
PVT.nmea_output_file_path=/mnt/e/rain/F1023_clear/results/nmea
PVT.nmea_dump_filename=F1023_clear_trajectory.nmea

; Additional PVT/trajectory products for provenance and QA
PVT.gpx_output_enabled=true
PVT.gpx_rate_ms=1000
PVT.gpx_output_path=/mnt/e/rain/F1023_clear/results/trajectory

PVT.geojson_output_enabled=true
PVT.geojson_rate_ms=1000
PVT.geojson_output_path=/mnt/e/rain/F1023_clear/results/trajectory

PVT.kml_output_enabled=true
PVT.kml_rate_ms=1000
PVT.kml_output_path=/mnt/e/rain/F1023_clear/results/trajectory

; Navigation-data XML output, useful as supplementary ephemeris provenance
PVT.xml_output_enabled=true
PVT.xml_output_path=/mnt/e/rain/F1023_clear/results/navigation

; Internal PVT dump
PVT.dump=true
PVT.dump_filename=/mnt/e/rain/F1023_clear/results/pvt/F1023_clear_pvt.dat
PVT.dump_mat=true
